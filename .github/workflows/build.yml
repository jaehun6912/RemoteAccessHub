name: build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build RemoteAccessHub.sln -c Release

      # 단위 검사만 실행한다. 통합 자체검사(--selftest)는 창과 WebView2가 필요해 로컬에서 build.ps1 -SelfTest로 돌린다.
      - name: Unit tests
        run: dotnet test tests/RemoteAccessHub.Tests/RemoteAccessHub.Tests.csproj -c Release --no-build

      - name: Publish (framework-dependent, unsigned)
        run: dotnet publish src/RemoteAccessHub/RemoteAccessHub.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteAccessHub-win-x64-unsigned
          path: artifacts/publish
          retention-days: 14
